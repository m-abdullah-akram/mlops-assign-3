# Whole VisionGuard stack: `docker compose up --build -d`
name: ${COMPOSE_PROJECT_NAME:-22l_6632_a2_ops}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data      # named volume: data survives container removal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # deliberately NO "ports:" - reachable only from other services on the Compose network

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy            # start only after Postgres accepts connections
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MODEL_PATH: /models/champion/model.keras
      THRESHOLD: ${THRESHOLD:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      INFERENCE_MODE: ${INFERENCE_MODE:-local}
      REMOTE_API_URL: ${REMOTE_API_URL:-}
      REMOTE_API_KEY: ${REMOTE_API_KEY:-}
      FLASK_DEBUG: "0"
    volumes:
      - ./models:/models:ro                   # model is mounted (read-only), not baked into the image
    ports:
      - "5000:5000"

volumes:
  pgdata:
